version: '3.8'

services:
  dsh-bridge-server:
    build: .
    image: dsh-bridge-server:latest
    container_name: dsh-bridge-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ALLOWED_TOKENS=change-me-to-secure-token
      - PUBLIC_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
